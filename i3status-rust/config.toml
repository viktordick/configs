icons_format = "{icon}"

[theme]
theme = "solarized-light"
[theme.overrides]
idle_bg = "#123456"
idle_fg = "#abcdef"

[icons]
icons = "awesome4"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "custom"
command = "statpsi"
persistent = true
json = true


[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "battery"
format = " $icon $percentage "

[[block]]
block = "net"
format = " $icon $ip "

[[block]]
block = "sound"

[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "keyboard_layout"
driver = "sway"
[block.mappings]
"English (custom Dvorak)" = "dv"
"German (N/A)" = "de"

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'[KW%V] %Y-%m-%d %H:%M:%S') "
